{% extends "base.html" %}
{% block title %}{{ '编辑文章' if post else '写文章' }}{% endblock %}

{% block content %}
<div class="admin-page">
    <div class="container container-sm">
        <div class="admin-header">
            <h1>{{ '编辑文章' if post else '写新文章' }}</h1>
            <a href="{{ url_for('admin.posts') }}" class="btn btn-outline">&larr; 返回列表</a>
        </div>

        <form method="POST" enctype="multipart/form-data" class="post-form">
            <div class="form-group">
                <label for="title">标题 *</label>
                <input type="text" name="title" id="title" value="{{ post.title if post else '' }}" placeholder="文章标题" required class="input-lg">
            </div>

            <div class="form-row-2">
                <div class="form-group">
                    <label for="category_id">分类</label>
                    <select name="category_id" id="category_id">
                        <option value="">无分类</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {{ 'selected' if post and post.category_id == cat.id else '' }}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="tags">标签 (逗号分隔)</label>
                    <input type="text" name="tags" id="tags" value="{{ post.tags | map(attribute='name') | join(', ') if post else '' }}" placeholder="如：表达式, 粒子, 入门">
                </div>
            </div>

            <div class="form-group">
                <label for="summary">摘要</label>
                <textarea name="summary" id="summary" rows="2" placeholder="文章简短描述...">{{ post.summary if post else '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="content">内容 * (支持HTML)</label>
                <div class="editor-toolbar">
                    <button type="button" class="toolbar-btn" data-tag="h2" title="标题">H2</button>
                    <button type="button" class="toolbar-btn" data-tag="h3" title="小标题">H3</button>
                    <button type="button" class="toolbar-btn" data-tag="p" title="段落">P</button>
                    <button type="button" class="toolbar-btn" data-tag="strong" title="加粗">B</button>
                    <button type="button" class="toolbar-btn" data-tag="em" title="斜体">I</button>
                    <button type="button" class="toolbar-btn" data-tag="a" data-attr="href" title="链接">🔗</button>
                    <button type="button" class="toolbar-btn" data-tag="img" data-attr="src" title="图片">🖼</button>
                    <button type="button" class="toolbar-btn" data-tag="blockquote" title="引用">❝</button>
                    <button type="button" class="toolbar-btn" data-tag="pre" title="代码">&#60;/&#62;</button>
                </div>
                <textarea name="content" id="content" rows="20" placeholder="文章内容 (HTML)..." required class="editor-textarea">{{ post.content if post else '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="cover_image">封面图片</label>
                <input type="file" name="cover_image" id="cover_image" accept="image/*">
                {% if post and post.cover_image %}
                <div class="current-cover">
                    <img src="{{ post.cover_image }}" alt="当前封面" style="max-width:300px;border-radius:8px;margin-top:8px">
                </div>
                {% endif %}
            </div>

            <div class="form-row">
                <label class="checkbox-label">
                    <input type="checkbox" name="is_published" {{ 'checked' if post and post.is_published else '' }}> 发布
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="is_featured" {{ 'checked' if post and post.is_featured else '' }}> 精选推荐
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-lg">{{ '更新文章' if post else '创建文章' }}</button>
                <a href="{{ url_for('admin.posts') }}" class="btn btn-outline">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
