{% extends "base.html" %}
{% block title %}登录{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <a href="{{ url_for('blog.index') }}" class="logo" style="justify-content:center;margin-bottom:16px">
                <span class="logo-icon">A</span>
                <span class="logo-text">AEN</span>
            </a>
            <h2>欢迎回来</h2>
            <p>登录你的AEN账号</p>
        </div>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" name="username" id="username" placeholder="输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" name="password" id="password" placeholder="输入密码" required>
            </div>
            <div class="form-row">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember"> 记住我
                </label>
            </div>
            <button type="submit" class="btn btn-primary btn-block">登录</button>
        </form>
        <div class="auth-footer">
            <p>还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a></p>
        </div>
    </div>
</div>
{% endblock %}
