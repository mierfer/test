services:
  - type: web
    name: aen-blog
    runtime: python
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn application.wsgi -w 2 -b 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_CONFIG
        value: production
